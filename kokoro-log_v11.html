<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>心ログ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心ログ">
<meta name="theme-color" content="#EEF1EA">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22%E5%BF%83%E3%83%AD%E3%82%B0%22%2C%20%22short_name%22%3A%20%22%E5%BF%83%E3%83%AD%E3%82%B0%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%23EEF1EA%22%2C%20%22theme_color%22%3A%20%22%23EEF1EA%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1EA;
    --bg-soft: #F7F8F4;
    --paper: #FFFFFF;
    --ink: #383B33;
    --ink-soft: #6B6E63;
    --ink-faint: #A2A599;
    --ink-on-dark: #F7F8F4;
    --moss-50: #E4EBDF;
    --moss-200: #BFD1B4;
    --moss-400: #8CAB7C;
    --moss-600: #5C7E4E;
    --moss-800: #3E5A37;
    --plum: #8D7A9C;
    --plum-soft: #EDE7F1;
    --sand: #D9C6A0;
    --sand-soft: #F3ECDC;
    --sky: #8FAEBF;
    --sky-soft: #E6EEF1;
    --line: #E1E3DA;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 14px rgba(56, 59, 51, 0.06);
    --font-display: "Shippori Mincho", serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    height: 100%;
    overscroll-behavior-y: none;
  }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding-bottom: 104px;
    padding-top: env(safe-area-inset-top);
    position: relative;
  }
  ::selection{ background: var(--moss-200); }
  button{ font-family: inherit; }
  input, textarea{ font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 28px 22px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .topbar .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }
  .topbar h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    color: var(--moss-800);
  }
  .topbar .date{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ---------- Sections / cards ---------- */
  .section{
    padding: 6px 20px 26px;
  }
  .card{
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--moss-800);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .muted{ color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  .empty-hint{
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.8;
    padding: 10px 2px 4px;
  }

  /* ---------- Score orb ---------- */
  .orb-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 4px;
  }
  .orb{
    width: 158px;
    height: 158px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  @media (prefers-reduced-motion: reduce){
    .orb{ animation: none; }
  }
  .orb-inner{
    text-align: center;
  }
  .orb-num{
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }
  .orb-num small{ font-size: 15px; font-weight: 500; opacity: 0.75; }
  .orb-label{
    font-size: 12px;
    margin-top: 6px;
    opacity: 0.85;
  }
  .orb-caption{
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.7;
    padding: 0 12px;
  }

  /* ---------- List items ---------- */
  .item-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child{ border-bottom: none; }
  .check{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--moss-400);
    flex: none;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s;
  }
  .check.done{ background: var(--moss-400); }
  .check.done::after{
    content:"";
    width: 8px; height: 5px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(0,-1px);
  }
  .item-text{
    flex: 1;
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
    min-width: 0;
  }
  .item-text.done{ color: var(--ink-faint); }
  .item-edit-input{
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    padding: 6px 8px;
    border: 1px solid var(--moss-400);
    border-radius: 8px;
    background: var(--bg-soft);
    color: var(--ink);
  }
  .item-icon-btn{
    border: none; background: none; color: var(--ink-faint);
    font-size: 14px; cursor: pointer; padding: 4px 5px; line-height:1;
    flex: none;
  }
  .item-del{
    border: none; background: none; color: var(--ink-faint);
    font-size: 18px; cursor: pointer; padding: 4px 6px; line-height:1;
    flex: none;
  }
  .stars{ font-size: 13px; color: var(--sand); letter-spacing: 1px; flex: none; }

  /* ---------- Add row (kept understated so it doesn't dominate the list) ---------- */
  .add-row{
    display: flex; gap: 8px; margin-top: 10px; align-items: center;
  }
  .add-row input, .add-row textarea{
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    border-radius: 0;
    padding: 8px 2px;
    font-size: 14px;
    color: var(--ink);
  }
  .add-row input:focus, .add-row textarea:focus, .diary-textarea:focus{
    outline: none;
    border-color: var(--moss-400);
  }
  .btn-add-circle{
    border: none;
    border-radius: 50%;
    width: 34px; height: 34px;
    flex: none;
    background: var(--moss-600);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: 1;
  }
  .btn-add-circle:active{ transform: scale(0.93); }
  .tag-toggle{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 10px;
    font-size: 15px;
    padding: 7px 9px;
    cursor: pointer;
    flex: none;
    color: var(--ink-soft);
    line-height: 1;
  }
  .tag-toggle.active{ background: var(--moss-50); border-color: var(--moss-400); }

  /* ---------- Genre ---------- */
  .card-title-row{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title-row .card-title{ margin-bottom: 0; }
  .sort-toggle{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--ink-soft);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sort-toggle.active{ background: var(--moss-50); color: var(--moss-800); border-color: var(--moss-200); }
  .genre-badge{
    border: none; background: transparent;
    font-size: 15px; line-height: 1; cursor: pointer;
    flex: none; width: 20px; text-align: center; padding: 0;
  }
  .genre-badge-empty{
    display: inline-block;
    width: 11px; height: 11px;
    border: 1.4px dashed var(--ink-faint);
    border-radius: 50%;
  }
  .genre-strip{
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 4px 2px 12px 28px;
  }
  .genre-chip{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 8px;
    font-size: 15px;
    padding: 3px 8px;
    cursor: pointer;
    line-height: 1.3;
    color: var(--ink-soft);
  }
  .genre-chip.active{ background: var(--moss-50); border-color: var(--moss-400); }
  .genre-group-label{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 12px 2px 4px;
  }
  .genre-group-label:first-child{ padding-top: 0; }

  /* ---------- Home plant ---------- */
  .plant-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 2px;
    animation: sway 6s ease-in-out infinite;
    transform-origin: 70px 120px;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-1deg); }
    50%{ transform: rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .plant-wrap{ animation: none; }
  }

  /* ---------- Calendar mood badge ---------- */
  .cal-cell{ position: relative; }
  .cal-mood{
    font-size: 14px;
    line-height: 1;
    height: 15px;
  }
  .btn{
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--moss-600);
    color: white;
    white-space: nowrap;
    flex: none;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.secondary{
    background: var(--bg-soft);
    color: var(--moss-800);
    border: 1px solid var(--moss-200);
  }
  .btn.ghost{
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .btn.small{ padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled{ opacity: 0.5; cursor: default; }

  .star-picker{ display:flex; gap:4px; margin-top:8px; }
  .star-picker span{ font-size: 20px; cursor: pointer; color: var(--line); }
  .star-picker span.active{ color: var(--sand); }

  /* ---------- Sub tabs ---------- */
  .subtabs{
    display: flex;
    gap: 6px;
    padding: 0 20px 14px;
  }
  .subtab{
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    background: var(--bg-soft);
    color: var(--ink-soft);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .subtab.active{
    background: var(--moss-50);
    color: var(--moss-800);
    border-color: var(--moss-200);
  }
  .mini-tabs{
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
  }
  .mini-tab{
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    background: var(--bg-soft);
    color: var(--ink-soft);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .mini-tab.active{
    background: var(--moss-50);
    color: var(--moss-800);
    border-color: var(--moss-200);
  }
  .item-icon-btn.has-memo{ color: var(--moss-600); }

  /* ---------- Diary ---------- */
  .diary-textarea{
    width: 100%;
    min-height: 160px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 14px;
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--ink);
    resize: vertical;
  }
  .diary-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .diary-nav .navdate{ font-family: var(--font-display); font-size: 15px; color: var(--moss-800); }
  .iconbtn{
    border:none; background: var(--bg-soft); width:32px; height:32px; border-radius:50%;
    color: var(--ink-soft); font-size: 15px; cursor:pointer;
  }
  .notif-badge{
    position: absolute;
    top: 3px; right: 4px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--moss-600);
    border: 1.5px solid var(--paper);
  }
  .notif-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--moss-600);
    flex: none;
    margin-top: 5px;
  }
  .save-toast{
    font-size: 12px; color: var(--moss-600); margin-top: 8px; height: 16px;
  }
  .emoji-row{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .emoji-btn{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 10px;
    font-size: 19px;
    padding: 4px 8px;
    cursor: pointer;
    line-height: 1.3;
  }
  .emoji-btn:active{ transform: scale(0.94); }
  .emoji-btn.active{
    background: var(--moss-50);
    border-color: var(--moss-400);
    box-shadow: inset 0 0 0 1px var(--moss-400);
  }

  /* ---------- Calendar ---------- */
  .cal-nav{
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px 10px;
  }
  .cal-nav .month{ font-family: var(--font-display); font-size: 18px; color: var(--moss-800); }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 20px 10px;
  }
  .cal-dow{
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    padding-bottom: 4px;
  }
  .cal-cell{
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    padding: 4px 2px 3px;
    gap: 1px;
  }
  .cal-cell.empty{ visibility: hidden; cursor: default; }
  .cal-cell .d{ font-weight: 700; }
  .cal-cell .s{ font-size: 9px; opacity: 0.9; }
  .cal-legend{
    display:flex; align-items:center; gap:10px; padding: 4px 20px 4px;
    font-size: 11px; color: var(--ink-faint); flex-wrap: wrap;
  }
  .legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }

  /* ---------- Sheet / modal ---------- */
  .sheet-overlay{
    position: fixed; inset: 0; background: rgba(56,59,51,0.35);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .sheet{
    background: var(--bg);
    width: 100%; max-width: 480px;
    border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(30px + env(safe-area-inset-bottom));
    max-height: 82vh;
    overflow-y: auto;
    animation: slideup 0.25s ease-out;
  }
  @keyframes slideup{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .sheet-head h2{
    font-family: var(--font-display); font-size: 18px; margin:0; color: var(--moss-800);
  }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 0;
    width: 100%; max-width: 480px;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  .navbtn{
    flex: 1;
    border: none; background: none;
    display: flex; flex-direction: column; align-items:center; gap:3px;
    font-size: 10.5px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px 0;
  }
  .navbtn .ic{ font-size: 19px; }
  .navbtn.active{ color: var(--moss-600); }

  /* ---------- Weekly review ---------- */
  .stat-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-box{
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 14px;
    text-align: center;
  }
  .stat-num{ font-family: var(--font-display); font-size: 22px; color: var(--moss-800); }
  .stat-label{ font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .voice-chip{
    display: inline-block;
    background: var(--moss-50);
    color: var(--moss-800);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    margin: 4px 6px 0 0;
  }

  .weekend-tag{
    font-size: 10.5px; color: var(--plum); background: var(--plum-soft);
    padding: 2px 8px; border-radius: 999px; margin-left: 6px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   心ログ — 状態管理
========================================================= */
const STORAGE_KEY = "kokoro-log-data-v1";

function defaultState(){
  return {
    dailyWants: {},   // { "YYYY-MM-DD": [{id,text,done}] }
    wishlist: [],      // [{id,text,createdAt,completedAt,done}]
    restList: [],       // [{id,text,stars}]
    weekendList: [],     // [{id,text,done,completedAt}]
    weekendHistory: [],   // [{text,genre}] recently used weekend entries, for quick re-adding
    notifications: [],      // [{id,weekStart,weekEnd,read}] accumulating weekly reports
    diary: {},            // { "YYYY-MM-DD": text }
    moods: {},              // { "YYYY-MM-DD": "😊" }
    genres: [               // [{key,emoji,label}] — customizable by the user
      { key:"out",    emoji:"🚶", label:"外出" },
      { key:"food",   emoji:"🍜", label:"食" },
      { key:"read",   emoji:"📚", label:"読書" },
      { key:"watch",  emoji:"🎬", label:"映像" },
      { key:"shop",   emoji:"🛍️", label:"買い物" },
      { key:"home",   emoji:"🏠", label:"家事・部屋" },
      { key:"hobby",  emoji:"🎨", label:"趣味" },
      { key:"people", emoji:"🧑‍🤝‍🧑", label:"人と会う" },
      { key:"body",   emoji:"🌿", label:"からだ" },
      { key:"other",  emoji:"✨", label:"その他" }
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    if((!merged.weekendHistory || merged.weekendHistory.length===0) && merged.weekendList.length){
      merged.weekendHistory = merged.weekendList.slice(-10).map(w=>({text:w.text, genre:w.genre||null})).reverse();
    }
    // Drop any notifications saved in the old pre-type/periodStart schema so they can't break rendering;
    // they'll be regenerated correctly (in the new format) the next time notifications are checked.
    merged.notifications = Array.isArray(merged.notifications)
      ? merged.notifications.filter(n => n && n.type && n.periodStart && n.periodEnd)
      : [];
    return merged;
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let ui = {
  tab: "home",
  wantsSub: "today",
  calCursor: new Date(),
  detailDate: null,
  reviewOpen: false,
  diaryDate: todayStr(),
  diaryDraft: null,
  editing: null,          // "today|dateStr|id" / "wishlist|id" / "weekend|id" / "rest|id"
  genrePickerFor: null,   // same key format, for reassigning an existing item's genre
  genrePickerOpenForAdd: false,
  sortByGenre: { today:false, long:false, weekend:false },
  restSortMode: "default",   // "default" | "stars" | "genre"
  genreSettingsOpen: false,
  editingGenreId: null,
  memoFor: null,              // rowKey, opens the memo sheet for that item
  memoDraft: null,
  addSheetFor: null,          // "today" | "long" | "weekend" | "rest"
  historyPickerOpenForAdd: false,
  inboxOpen: false,
  inboxDetailId: null
};
let newItemGenreDraft = null;
let restStarDraft = 3;

function genreEmoji(key){ const g = state.genres.find(x=>x.key===key); return g ? g.emoji : null; }
function genreLabel(key){ const g = state.genres.find(x=>x.key===key); return g ? g.label : ""; }

/* ---------------- ジャンル設定 ---------------- */

/* =========================================================
   日付ユーティリティ
========================================================= */
function pad(n){ return n.toString().padStart(2,"0"); }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
const DOW = ["日","月","火","水","木","金","土"];
function niceDate(s){
  const d = parseYmd(s);
  return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   スコア
========================================================= */
function scoreFor(dateStr){
  const list = state.dailyWants[dateStr];
  if(!list || list.length === 0) return null;
  const done = list.filter(i=>i.done).length;
  return Math.round((done/list.length)*100);
}

function scoreRGB(score){
  if(score === null) return null;
  const t = score/100;
  const c1 = [228,235,223], c2 = [92,126,78];
  return [
    Math.round(c1[0] + (c2[0]-c1[0])*t),
    Math.round(c1[1] + (c2[1]-c1[1])*t),
    Math.round(c1[2] + (c2[2]-c1[2])*t)
  ];
}
function scoreColor(score){
  const rgb = scoreRGB(score);
  return rgb ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` : "var(--bg-soft)";
}
function scoreTextColor(score){
  const rgb = scoreRGB(score);
  if(!rgb) return "var(--ink-soft)";
  const luminance = 0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2];
  return luminance < 150 ? "var(--ink-on-dark)" : "var(--ink)";
}
function orbGradient(score){
  const rgb = scoreRGB(score);
  if(!rgb) return "var(--bg-soft)";
  const [r,g,b] = rgb;
  const lighten = (v)=> Math.min(255, v + 22);
  const light = `rgb(${lighten(r)},${lighten(g)},${lighten(b)})`;
  const base = `rgb(${r},${g},${b})`;
  return `radial-gradient(circle at 35% 30%, ${light}, ${base})`;
}

function scoreCaption(score){
  if(score === null) return "今日はまだ何も登録されていません。小さな声でも、聞こえたら書いてみましょう。";
  if(score >= 80) return "自分の声に、たくさん応えてあげられています。";
  if(score >= 50) return "自分の声に、ちゃんと耳を傾けられています。";
  if(score >= 20) return "少しだけでも、自分のために動けた日です。";
  return "今日は難しかったかもしれません。それでも、書き残せたことが一歩です。";
}

/* =========================================================
   今日の植物（スコア・気分でさりげなく様子が変わる）
========================================================= */
const MOOD_GLOW = {
  "😊": "#E8C97A", "😌": "#8FAEBF", "🥰": "#D999B0",
  "😢": "#8FA3C4", "😴": "#A79BC4", "😠": "#C97A6E",
  "😰": "#A79BC4", "😐": "#B9BBB1", "🎉": "#E0A85C", "💪": "#7C9A6B"
};
function renderPlant(score, mood){
  const tier = score === null ? "dormant" : score < 30 ? "low" : score < 55 ? "mid" : score < 80 ? "full" : "lush";
  const config = {
    dormant: { top:80, color:"#BFD1B4", leaves:[{t:0.5,ang:-40,len:9},{t:0.95,ang:35,len:9}] },
    low:     { top:66, color:"#8CAB7C", leaves:[{t:0.3,ang:-45,len:12},{t:0.6,ang:40,len:12},{t:0.95,ang:-18,len:13}] },
    mid:     { top:52, color:"#6B9257", leaves:[{t:0.25,ang:-50,len:15},{t:0.45,ang:45,len:15},{t:0.65,ang:-35,len:16},{t:0.85,ang:38,len:16},{t:1,ang:-10,len:13}] },
    full:    { top:40, color:"#5C7E4E", leaves:[{t:0.2,ang:-52,len:17},{t:0.38,ang:48,len:17},{t:0.55,ang:-38,len:18},{t:0.72,ang:40,len:18},{t:0.88,ang:-22,len:15},{t:1,ang:18,len:13},{t:1,ang:-14,len:13}] },
    lush:    { top:26, color:"#4C6E40", leaves:[{t:0.15,ang:-55,len:18},{t:0.3,ang:52,len:18},{t:0.45,ang:-42,len:19},{t:0.6,ang:44,len:19},{t:0.74,ang:-30,len:17},{t:0.87,ang:28,len:16},{t:0.97,ang:-14,len:14},{t:1,ang:14,len:13},{t:1,ang:0,len:12}] }
  };
  const c = config[tier];
  const baseX = 70, baseY = 92;
  let leavesSvg = "";
  c.leaves.forEach(leaf=>{
    const y = baseY - (baseY - c.top) * leaf.t;
    const rad = leaf.ang * Math.PI / 180;
    const ex = (baseX + Math.sin(rad) * leaf.len).toFixed(1);
    const ey = (y - Math.cos(rad) * leaf.len * 0.4).toFixed(1);
    const ry = (leaf.len * 0.42).toFixed(1);
    leavesSvg += `<ellipse cx="${ex}" cy="${ey}" rx="${leaf.len}" ry="${ry}" fill="${c.color}" transform="rotate(${leaf.ang} ${ex} ${ey})" opacity="0.92"/>`;
  });
  const glowColor = mood ? MOOD_GLOW[mood] : null;
  const glowSvg = glowColor ? `<ellipse cx="70" cy="70" rx="55" ry="50" fill="${glowColor}" opacity="0.16"/>` : "";
  return `
    <svg viewBox="0 0 140 128" width="118" height="108">
      ${glowSvg}
      <ellipse cx="70" cy="94" rx="26" ry="6" fill="#00000012"/>
      <path d="M46 92 L94 92 L87 120 L53 120 Z" fill="#D9C6A0"/>
      <ellipse cx="70" cy="92" rx="24" ry="5" fill="#8a7452" opacity="0.35"/>
      <line x1="70" y1="92" x2="70" y2="${c.top}" stroke="${c.color}" stroke-width="3" stroke-linecap="round"/>
      ${leavesSvg}
    </svg>
  `;
}

function genrePickerStrip(rowKey, currentGenre){
  const safeKey = escapeAttr(rowKey);
  const chips = state.genres.map(g => `<button type="button" class="genre-chip ${currentGenre===g.key?'active':''}" onclick="applyItemGenre('${safeKey}','${g.key}')">${g.emoji}</button>`).join("");
  return `<div class="genre-strip">${chips}<button type="button" class="genre-chip" onclick="applyItemGenre('${safeKey}', null)">なし</button></div>`;
}
function toggleGenrePicker(rowKey){
  ui.genrePickerFor = (ui.genrePickerFor === rowKey) ? null : rowKey;
  render();
}
function findItemByRowKey(rowKey){
  const parts = rowKey.split("|");
  const type = parts[0];
  if(type === "today"){
    const list = state.dailyWants[parts[1]];
    return list && list.find(i=>i.id===parts[2]);
  }else if(type === "wishlist"){
    return state.wishlist.find(i=>i.id===parts[1]);
  }else if(type === "weekend"){
    return state.weekendList.find(i=>i.id===parts[1]);
  }else if(type === "rest"){
    return state.restList.find(i=>i.id===parts[1]);
  }
  return null;
}
function applyItemGenre(rowKey, genreKey){
  const item = findItemByRowKey(rowKey);
  if(item) item.genre = genreKey;
  ui.genrePickerFor = null;
  saveState();
  render();
}
function startEdit(key){ ui.editing = key; ui.genrePickerFor = null; render(); }
function cancelEdit(){ ui.editing = null; render(); }
function commitEdit(key, value){
  const text = value.trim();
  ui.editing = null;
  if(!text){ render(); return; }
  const item = findItemByRowKey(key);
  if(item) item.text = text;
  saveState();
  render();
}

function addFromSheet(listKey){

  const text = input.value.trim();
  if(!text) return;
  if(listKey === "today" || listKey.startsWith("today@")){
    const dateStr = listKey.startsWith("today@") ? listKey.slice(6) : todayStr();
    if(dateStr > todayStr()) return;
    if(!state.dailyWants[dateStr]) state.dailyWants[dateStr] = [];
    state.dailyWants[dateStr].push({ id: uid(), text, done:false, genre: newItemGenreDraft });
  }else if(listKey === "long"){
    state.wishlist.push({ id: uid(), text, createdAt: todayStr(), completedAt: null, done:false, genre: newItemGenreDraft });
  }else if(listKey === "weekend"){
    state.weekendList.push({ id: uid(), text, done:false, completedAt:null, genre: newItemGenreDraft });

    state.restList.push({ id: uid(), text, stars: restStarDraft, genre: newItemGenreDraft });
    restStarDraft = 3;

  newItemGenreDraft = null;
  saveState();
  render();

/* ---------------- 「今日」向けの履歴・休憩リストからのクイック追加 ---------------- */
function recentWantEntries(){
  const dates = Object.keys(state.dailyWants).sort().reverse();
  const seen = new Set();
  const result = [];
  for(const d of dates){
    const items = state.dailyWants[d];
    for(let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      if(!seen.has(it.text)){
        seen.add(it.text);
        result.push({ text: it.text, genre: it.genre || null });
      }
      if(result.length >= 10) return result;
    }
  }
  return result;
}
function toggleHistoryPicker(){
  ui.historyPickerOpenForAdd = !ui.historyPickerOpenForAdd;
  render();
}
function quickAddToday(text, genre){
  const today = todayStr();
  if(!state.dailyWants[today]) state.dailyWants[today] = [];
  state.dailyWants[today].push({ id: uid(), text, done:false, genre: genre || null });
  saveState();
  render();
}
function suggestionGroup(label, items, onclickFnName){
  if(!items.length) return "";
  let html = `<div class="muted" style="margin:10px 0 4px;">${label}</div><div class="genre-strip" style="padding-left:2px;">`;
  html += items.map(it => `<button type="button" class="genre-chip" onmousedown="event.preventDefault()" onclick="${onclickFnName}('${escapeAttr(it.text)}', ${it.genre ? `'${it.genre}'` : "null"})">${it.genre ? genreEmoji(it.genre)+" " : ""}${escapeHtml(it.text)}</button>`).join("");
  html += `</div>`;
  return html;
}
function historyStripForForm(){
  if(!ui.historyPickerOpenForAdd) return "";
  const history = recentWantEntries();
  const restItems = state.restList.map(r=>({text:r.text, genre:r.genre}));
  const weekendItems = state.weekendList.map(w=>({text:w.text, genre:w.genre}));
  const wishlistItems = state.wishlist.filter(w=>!w.done).map(w=>({text:w.text, genre:w.genre}));
  let html = "";
  html += suggestionGroup("よく使う", history, "quickAddToday");
  html += suggestionGroup("休憩リストから", restItems, "quickAddToday");
  html += suggestionGroup("週末やりたいことから", weekendItems, "quickAddToday");
  html += suggestionGroup("いつかやりたいことから", wishlistItems, "quickAddToday");
  if(!history.length && !restItems.length && !weekendItems.length && !wishlistItems.length){
    html += `<div class="empty-hint">まだ履歴がありません。</div>`;
  }
  return html;
}

/* ---------------- 週末リストの履歴 ---------------- */
function recordWeekendHistory(text, genre){
  if(!state.weekendHistory) state.weekendHistory = [];
  state.weekendHistory = state.weekendHistory.filter(h=>h.text !== text);
  state.weekendHistory.unshift({ text, genre: genre || null });
  state.weekendHistory = state.weekendHistory.slice(0, 10);
}
function quickAddWeekend(text, genre){

function weekendSuggestionsStrip(){
  if(!ui.historyPickerOpenForAdd) return "";
  const history = state.weekendHistory || [];
  const currentTexts = new Set(state.weekendList.map(w=>w.text));
  const wishlistItems = state.wishlist.filter(w=>!w.done && !currentTexts.has(w.text)).map(w=>({text:w.text, genre:w.genre}));
  let html = "";
  html += suggestionGroup("よく使う", history, "quickAddWeekend");

/* ---------------- 汎用：ジャンル順の並び替え・グループ表示 ---------------- */
function sortByGenreIfNeeded(items, on){
  if(!on) return items;
  const order = state.genres.map(g=>g.key);
  return items.map((item,i)=>({item,i})).sort((a,b)=>{
    const ai = a.item.genre ? order.indexOf(a.item.genre) : order.length;
    const bi = b.item.genre ? order.indexOf(b.item.genre) : order.length;
    if(ai !== bi) return ai - bi;
    return a.i - b.i;
  }).map(x=>x.item);
}
function renderItemsWithGenreGroups(items, groupOn, rowRenderFn){
  if(!groupOn) return items.map(rowRenderFn).join("");
  let html = "";
  let lastGenre = "__unset__";
  items.forEach(item=>{
    if(item.genre !== lastGenre){
      lastGenre = item.genre;
      const label = item.genre ? `${genreEmoji(item.genre)} ${genreLabel(item.genre)}` : "🏷️ ジャンルなし";
      html += `<div class="genre-group-label">${label}</div>`;
    }
    html += rowRenderFn(item);
  });
  return html;
}

/* ---------------- カレンダー ---------------- */
function renderCalendar(){
  const cursor = ui.calCursor;
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let cells = "";
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = fmt(dateObj);
    const score = scoreFor(dateStr);
    const isToday = dateStr === todayStr();
    const textColor = scoreTextColor(score);
    const borderColor = isToday ? (textColor === "var(--ink-on-dark)" ? "rgba(255,255,255,0.9)" : "var(--moss-600)") : "transparent";
    const mood = getMood(dateStr);
    cells += `
      <div class="cal-cell" style="background:${scoreColor(score)};color:${textColor};border-color:${borderColor};" onclick="openDetail('${dateStr}')">
        <div class="cal-mood">${mood || ""}</div>
        <div class="d">${d}</div>
        <div class="s">${score===null?'':score}</div>
      </div>
    `;
  }

  return `
    <div class="cal-nav">
      <button class="iconbtn" onclick="shiftMonth(-1)">‹</button>
      <div class="month">${year}年 ${month+1}月</div>
      <button class="iconbtn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(w=>`<div class="cal-dow">${w}</div>`).join("")}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="legend-dot" style="background:${scoreColor(20)}"></span>低め</span>
      <span><span class="legend-dot" style="background:${scoreColor(60)}"></span>ふつう</span>
      <span><span class="legend-dot" style="background:${scoreColor(95)}"></span>高め</span>
      <span><span class="legend-dot" style="background:var(--bg-soft);border:1px solid var(--line)"></span>未登録</span>
    </div>
    <div class="section" style="padding-top:6px;">
      <button class="btn secondary" style="width:100%;" onclick="openReview()">今週の振り返りを見る</button>
    </div>
  `;
}

/* ---------------- 週次振り返り ---------------- */
function openReview(){ ui.reviewOpen = true; render(); }

function renderScoreLineChart(days, opts){
  opts = opts || {};
  const W = 300, H = 130;
  const padL = 26, padR = 12, padT = 14, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const n = days.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;
  const points = days.map((d, i) => {
    const s = scoreFor(d);
    const x = padL + stepX * i;
    const y = s === null ? null : padT + plotH - (s / 100) * plotH;
    return { x, y, s, d };
  });

  let grid = "";
  [0, 50, 100].forEach(v => {
    const y = padT + plotH - (v / 100) * plotH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#E1E3DA" stroke-width="1"/>`;
    grid += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" font-size="8" fill="#A2A599" text-anchor="end">${v}</text>`;
  });

  const segments = [];
  let current = [];
  points.forEach(p => {
    if(p.y === null){
      if(current.length) segments.push(current);
      current = [];
    }else{
      current.push(p);
    }
  });
  if(current.length) segments.push(current);

  const pathsSvg = segments.map(seg => {
    const d = seg.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="#5C7E4E" stroke-width="${n>10?2.2:2.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");

  const dotR = n > 10 ? 1.6 : 3.2;
  const dotsSvg = points.filter(p => p.y !== null).map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR}" fill="#5C7E4E"/>`
  ).join("");

  let labelsSvg = "";
  if(opts.labelMode === "sparse"){
    const every = Math.max(1, Math.ceil(n/6));
    points.forEach((p,i)=>{
      if(i % every === 0 || i === n-1){
        const dObj = parseYmd(p.d);
        labelsSvg += `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="8" fill="#6B6E63" text-anchor="middle">${dObj.getDate()}</text>`;
      }
    });
  }else{
    points.forEach(p=>{
      const dObj = parseYmd(p.d);
      labelsSvg += `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="9" fill="#6B6E63" text-anchor="middle">${DOW[dObj.getDay()]}</text>`;
    });
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">${grid}${pathsSvg}${dotsSvg}${labelsSvg}</svg>`;
}

function computeWeekStats(days){
  const scores = days.map(scoreFor).filter(s=>s!==null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const respondedDays = days.filter(d=>{ const s=scoreFor(d); return s!==null && s>0; }).length;
  let registered = 0, completed = 0;
  days.forEach(d=>{
    const list = state.dailyWants[d] || [];
    registered += list.length;
    completed += list.filter(i=>i.done).length;
  });
  const voices = [];
  days.forEach(d=> (state.dailyWants[d]||[]).forEach(i=> voices.push(i.text)));
  const uniqueVoices = [...new Set(voices)].slice(-10).reverse();
  return { avg, respondedDays, registered, completed, uniqueVoices };
}

function renderPeriodReportBody(days, opts){
  opts = opts || {};
  const periodWord = opts.periodWord || "週";
  const stats = opts.stats || computeWeekStats(days);
  const chartOpts = days.length > 10 ? { labelMode:"sparse" } : { labelMode:"weekday" };
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">${periodWord}間スコアの推移</div>
      ${renderScoreLineChart(days, chartOpts)}
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-num">${stats.avg===null?'—':stats.avg}</div>
          <div class="stat-label">平均スコア</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${stats.respondedDays} / ${days.length}</div>
          <div class="stat-label">自分の声に応えられた日</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${stats.registered}</div>
          <div class="stat-label">やりたいこと</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${stats.completed}</div>
          <div class="stat-label">実行したこと</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">この${periodWord}のあなたの心の声</div>
      ${stats.uniqueVoices.length === 0
        ? `<div class="empty-hint">まだ心の声が記録されていません。</div>`
        : stats.uniqueVoices.map(v=>`<span class="voice-chip">${escapeHtml(v)}</span>`).join("")
      }
    </div>
  `;
}

function renderReviewSheet(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();

/* ---------------- お知らせ（週・月ごとに積み重なる通知） ---------------- */
function mondayOfWeek(d){
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  return monday;
}
function daysBetween(startStr, endStr){
  const start = parseYmd(startStr), end = parseYmd(endStr);
  const days = [];
  const cur = new Date(start);
  while(cur <= end){
    days.push(fmt(cur));
    cur.setDate(cur.getDate()+1);
  }
  return days;
}
function weekDaysFrom(mondayStr){
  const start = parseYmd(mondayStr);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  return daysBetween(mondayStr, fmt(end));
}
function shortDate(dateStr){
  const d = parseYmd(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function periodMessageTitle(n){
  if(n.type === "month"){
    const d = parseYmd(n.periodStart);
    return `${d.getMonth()+1}月の記録が届きました`;
  }
  return `${shortDate(n.periodStart)}〜${shortDate(n.periodEnd)}の記録が届きました`;
}
function ensureWeeklyNotifications(){
  if(!state.notifications) state.notifications = [];
  const existing = new Set(state.notifications.filter(n=>n.type==="week").map(n=>n.periodStart));
  const thisMonday = mondayOfWeek(new Date());
  const cursor = new Date(thisMonday);
  cursor.setDate(cursor.getDate() - 7); // start from the last fully-completed week
  let changed = false;
  for(let i=0; i<26; i++){
    const mondayStr = fmt(cursor);
    if(!existing.has(mondayStr)){
      const days = weekDaysFrom(mondayStr);
      if(days.some(d => scoreFor(d) !== null)){
        state.notifications.push({ id: `week:${mondayStr}`, type:"week", periodStart: mondayStr, periodEnd: days[6], read:false });
        changed = true;
      }
    }
    cursor.setDate(cursor.getDate() - 7);
  }
  if(changed) saveState();
}
function ensureMonthlyNotifications(){
  if(!state.notifications) state.notifications = [];
  const existing = new Set(state.notifications.filter(n=>n.type==="month").map(n=>n.periodStart));
  const today = new Date();
  const cursor = new Date(today.getFullYear(), today.getMonth()-1, 1); // last fully-completed month
  let changed = false;
  for(let i=0; i<12; i++){
    const monthStart = fmt(cursor);
    const monthEndDate = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
    const monthEnd = fmt(monthEndDate);
    if(!existing.has(monthStart)){
      const days = daysBetween(monthStart, monthEnd);
      if(days.some(d => scoreFor(d) !== null)){
        state.notifications.push({ id: `month:${monthStart}`, type:"month", periodStart: monthStart, periodEnd: monthEnd, read:false });
        changed = true;
      }
    }
    cursor.setMonth(cursor.getMonth()-1);
  }
  if(changed) saveState();
}
function ensureAllNotifications(){
  ensureWeeklyNotifications();
  ensureMonthlyNotifications();
}
function unreadNotificationCount(){
  return (state.notifications||[]).filter(n=>!n.read).length;
}
function openInbox(){
  ensureAllNotifications();
  ui.inboxOpen = true;
  ui.inboxDetailId = null;
  render();
}
function closeInbox(){
  ui.inboxOpen = false;
  ui.inboxDetailId = null;
  render();
}
function openNotificationDetail(id){
  const n = (state.notifications||[]).find(x=>x.id===id);
  if(n && !n.read){ n.read = true; saveState(); }
  ui.inboxDetailId = id;
  render();
}
function backToInboxList(){ ui.inboxDetailId = null; render(); }
function renderInboxSheet(){
  if(ui.inboxDetailId) return renderNotificationDetailSheet(ui.inboxDetailId);
  const list = (state.notifications||[]).slice().sort((a,b)=> a.periodStart < b.periodStart ? 1 : -1);
  const rows = list.length === 0
    ? `<div class="empty-hint">まだお知らせはありません。1週間分の記録がたまると、ここに届きます。</div>`
    : list.map(n=>{
        const days = daysBetween(n.periodStart, n.periodEnd);
        const stats = computeWeekStats(days);
        const title = periodMessageTitle(n);
        const icon = n.type === "month" ? "🗓️" : "📅";
        const teaser = stats.avg===null ? "記録が少ない期間でした" : `平均${stats.avg}・${stats.respondedDays}/${days.length}日応えられました`;
        return `
          <div class="item-row" style="cursor:pointer;align-items:flex-start;" onclick="openNotificationDetail('${n.id}')">
            ${!n.read ? `<span class="notif-dot"></span>` : `<span style="width:8px;flex:none;"></span>`}
            <div style="flex:1;">
              <div style="font-weight:700;font-size:13.5px;">${icon} ${title}</div>
              <div class="muted" style="margin-top:2px;">${teaser}</div>
            </div>
            <div style="color:var(--ink-faint);font-size:16px;">›</div>
          </div>
        `;
      }).join("");
  return `
    <div class="sheet-overlay" onclick="if(event.target===this)closeInbox()">
      <div class="sheet">
        <div class="sheet-head">
          <h2>お知らせ</h2>
          <button class="iconbtn" onclick="closeInbox()">✕</button>
        </div>
        <div class="card">${rows}</div>
      </div>
    </div>
  `;
}
function renderNotificationDetailSheet(id){
  const n = (state.notifications||[]).find(x=>x.id===id);
  if(!n) return renderInboxSheet();
  const days = daysBetween(n.periodStart, n.periodEnd);
  const periodWord = n.type === "month" ? "月" : "週";
  const headerTitle = n.type === "month"
    ? `${parseYmd(n.periodStart).getMonth()+1}月の記録`
    : `${shortDate(n.periodStart)}〜${shortDate(n.periodEnd)}`;
  return `
    <div class="sheet-overlay" onclick="if(event.target===this)closeInbox()">
      <div class="sheet">
        <div class="sheet-head">
          <button class="iconbtn" onclick="backToInboxList()">‹</button>
          <h2>${headerTitle}</h2>
          <button class="iconbtn" onclick="closeInbox()">✕</button>
        </div>
        <div class="card" style="margin-bottom:12px;">
          <div class="muted">${periodMessageTitle(n)}。ゆっくり眺めてみてください。</div>
        </div>
        ${renderPeriodReportBody(days, { periodWord })}
      </div>
    </div>
  `;
}

/* ---------------- ユーティリティ ---------------- */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(str){
  return escapeHtml(str);
}
