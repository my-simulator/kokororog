<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>心ログ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心ログ">
<meta name="theme-color" content="#EEF1EA">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22%E5%BF%83%E3%83%AD%E3%82%B0%22%2C%20%22short_name%22%3A%20%22%E5%BF%83%E3%83%AD%E3%82%B0%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%23EEF1EA%22%2C%20%22theme_color%22%3A%20%22%23EEF1EA%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1EA;
    --bg-soft: #F7F8F4;
    --paper: #FFFFFF;
    --ink: #383B33;
    --ink-soft: #6B6E63;
    --ink-faint: #A2A599;
    --ink-on-dark: #F7F8F4;
    --moss-50: #E4EBDF;
    --moss-200: #BFD1B4;
    --moss-400: #8CAB7C;
    --moss-600: #5C7E4E;
    --moss-800: #3E5A37;
    --plum: #8D7A9C;
    --plum-soft: #EDE7F1;
    --sand: #D9C6A0;
    --sand-soft: #F3ECDC;
    --sky: #8FAEBF;
    --sky-soft: #E6EEF1;
    --line: #E1E3DA;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 14px rgba(56, 59, 51, 0.06);
    --font-display: "Shippori Mincho", serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    height: 100%;
    overscroll-behavior-y: none;
  }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding-bottom: 104px;
    padding-top: env(safe-area-inset-top);
    position: relative;
  }
  ::selection{ background: var(--moss-200); }
  button{ font-family: inherit; }
  input, textarea{ font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 28px 22px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .topbar .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }
  .topbar h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    color: var(--moss-800);
  }
  .topbar .date{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ---------- Sections / cards ---------- */
  .section{
    padding: 6px 20px 26px;
  }
  .card{
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--moss-800);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .muted{ color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  .empty-hint{
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.8;
    padding: 10px 2px 4px;
  }

  /* ---------- Score orb ---------- */
  .orb-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 4px;
  }
  .orb{
    width: 158px;
    height: 158px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  @media (prefers-reduced-motion: reduce){
    .orb{ animation: none; }
  }
  .orb-inner{
    text-align: center;
  }
  .orb-num{
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }
  .orb-num small{ font-size: 15px; font-weight: 500; opacity: 0.75; }
  .orb-label{
    font-size: 12px;
    margin-top: 6px;
    opacity: 0.85;
  }
  .orb-caption{
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.7;
    padding: 0 12px;
  }

  /* ---------- List items ---------- */
  .item-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child{ border-bottom: none; }
  .check{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--moss-400);
    flex: none;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s;
  }
  .check.done{ background: var(--moss-400); }
  .check.done::after{
    content:"";
    width: 8px; height: 5px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(0,-1px);
  }
  .item-text{
    flex: 1;
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
    min-width: 0;
  }
  .item-text.done{ color: var(--ink-faint); }
  .item-edit-input{
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    padding: 6px 8px;
    border: 1px solid var(--moss-400);
    border-radius: 8px;
    background: var(--bg-soft);
    color: var(--ink);
  }
  .item-icon-btn{
    border: none; background: none; color: var(--ink-faint);
    font-size: 14px; cursor: pointer; padding: 4px 5px; line-height:1;
    flex: none;
  }
  .item-del{
    border: none; background: none; color: var(--ink-faint);
    font-size: 18px; cursor: pointer; padding: 4px 6px; line-height:1;
    flex: none;
  }
  .stars{ font-size: 13px; color: var(--sand); letter-spacing: 1px; flex: none; }

  /* ---------- Add row (kept understated so it doesn't dominate the list) ---------- */
  .add-row{
    display: flex; gap: 8px; margin-top: 10px; align-items: center;
  }
  .add-row input, .add-row textarea{
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    border-radius: 0;
    padding: 8px 2px;
    font-size: 14px;
    color: var(--ink);
  }
  .add-row input:focus, .add-row textarea:focus, .diary-textarea:focus{
    outline: none;
    border-color: var(--moss-400);
  }
  .btn-add-circle{
    border: none;
    border-radius: 50%;
    width: 34px; height: 34px;
    flex: none;
    background: var(--moss-600);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: 1;
  }
  .btn-add-circle:active{ transform: scale(0.93); }
  .tag-toggle{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 10px;
    font-size: 15px;
    padding: 7px 9px;
    cursor: pointer;
    flex: none;
    color: var(--ink-soft);
    line-height: 1;
  }
  .tag-toggle.active{ background: var(--moss-50); border-color: var(--moss-400); }

  /* ---------- Genre ---------- */
  .card-title-row{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title-row .card-title{ margin-bottom: 0; }
  .sort-toggle{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--ink-soft);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sort-toggle.active{ background: var(--moss-50); color: var(--moss-800); border-color: var(--moss-200); }
  .genre-badge{
    border: none; background: transparent;
    font-size: 15px; line-height: 1; cursor: pointer;
    flex: none; width: 20px; text-align: center; padding: 0;
  }
  .genre-badge-empty{
    display: inline-block;
    width: 11px; height: 11px;
    border: 1.4px dashed var(--ink-faint);
    border-radius: 50%;
  }
  .genre-strip{
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 4px 2px 12px 28px;
  }
  .genre-chip{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 8px;
    font-size: 15px;
    padding: 3px 8px;
    cursor: pointer;
    line-height: 1.3;
    color: var(--ink-soft);
  }
  .genre-chip.active{ background: var(--moss-50); border-color: var(--moss-400); }
  .genre-group-label{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 12px 2px 4px;
  }
  .genre-group-label:first-child{ padding-top: 0; }

  /* ---------- Home plant ---------- */
  .plant-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 2px;
    animation: sway 6s ease-in-out infinite;
    transform-origin: 70px 120px;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-1deg); }
    50%{ transform: rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .plant-wrap{ animation: none; }
  }

  /* ---------- Calendar mood badge ---------- */
  .cal-cell{ position: relative; }
  .cal-mood{
    font-size: 14px;
    line-height: 1;
    height: 15px;
  }
  .btn{
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--moss-600);
    color: white;
    white-space: nowrap;
    flex: none;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.secondary{
    background: var(--bg-soft);
    color: var(--moss-800);
    border: 1px solid var(--moss-200);
  }
  .btn.ghost{
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .btn.small{ padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled{ opacity: 0.5; cursor: default; }

  .star-picker{ display:flex; gap:4px; margin-top:8px; }
  .star-picker span{ font-size: 20px; cursor: pointer; color: var(--line); }
  .star-picker span.active{ color: var(--sand); }

  /* ---------- Sub tabs ---------- */
  .subtabs{
    display: flex;
    gap: 6px;
    padding: 0 20px 14px;
  }
  .subtab{
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    background: var(--bg-soft);
    color: var(--ink-soft);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .subtab.active{
    background: var(--moss-50);
    color: var(--moss-800);
    border-color: var(--moss-200);
  }
  .mini-tabs{
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
  }
  .mini-tab{
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    background: var(--bg-soft);
    color: var(--ink-soft);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .mini-tab.active{
    background: var(--moss-50);
    color: var(--moss-800);
    border-color: var(--moss-200);
  }
  .item-icon-btn.has-memo{ color: var(--moss-600); }

  /* ---------- Diary ---------- */
  .diary-textarea{
    width: 100%;
    min-height: 160px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 14px;
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--ink);
    resize: vertical;
  }
  .diary-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .diary-nav .navdate{ font-family: var(--font-display); font-size: 15px; color: var(--moss-800); }
  .iconbtn{
    border:none; background: var(--bg-soft); width:32px; height:32px; border-radius:50%;
    color: var(--ink-soft); font-size: 15px; cursor:pointer;
  }
  .notif-badge{
    position: absolute;
    top: 3px; right: 4px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--moss-600);
    border: 1.5px solid var(--paper);
  }
  .notif-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--moss-600);
    flex: none;
    margin-top: 5px;
  }
  .global-toast{
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%) translateY(8px);
    background: var(--moss-800);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 70;
    max-width: 82%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .global-toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .save-toast{
    font-size: 12px; color: var(--moss-600); margin-top: 8px; height: 16px;
  }
  .emoji-row{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .emoji-btn{
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 10px;
    font-size: 19px;
    padding: 4px 8px;
    cursor: pointer;
    line-height: 1.3;
  }
  .emoji-btn:active{ transform: scale(0.94); }
  .emoji-btn.active{
    background: var(--moss-50);
    border-color: var(--moss-400);
    box-shadow: inset 0 0 0 1px var(--moss-400);
  }

  /* ---------- Calendar ---------- */
  .cal-nav{
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px 10px;
  }
  .cal-nav .month{ font-family: var(--font-display); font-size: 18px; color: var(--moss-800); }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 20px 10px;
  }
  .cal-dow{
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    padding-bottom: 4px;
  }
  .cal-cell{
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    padding: 4px 2px 3px;
    gap: 1px;
  }
  .cal-cell.empty{ visibility: hidden; cursor: default; }
  .cal-cell .d{ font-weight: 700; }
  .cal-cell .s{ font-size: 9px; opacity: 0.9; }
  .cal-legend{
    display:flex; align-items:center; gap:10px; padding: 4px 20px 4px;
    font-size: 11px; color: var(--ink-faint); flex-wrap: wrap;
  }
  .legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }

  /* ---------- Sheet / modal ---------- */
  .sheet-overlay{
    position: fixed; inset: 0; background: rgba(56,59,51,0.35);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .sheet{
    background: var(--bg);
    width: 100%; max-width: 480px;
    border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(30px + env(safe-area-inset-bottom));
    max-height: 82vh;
    overflow-y: auto;
    animation: slideup 0.25s ease-out;
  }
  @keyframes slideup{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .sheet-head h2{
    font-family: var(--font-display); font-size: 18px; margin:0; color: var(--moss-800);
  }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 0;
    width: 100%; max-width: 480px;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  .navbtn{
    flex: 1;
    border: none; background: none;
    display: flex; flex-direction: column; align-items:center; gap:3px;
    font-size: 10.5px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px 0;
  }
  .navbtn .ic{ font-size: 19px; }
  .navbtn.active{ color: var(--moss-600); }

  /* ---------- Weekly review ---------- */
  .stat-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-box{
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 14px;
    text-align: center;
  }
  .stat-num{ font-family: var(--font-display); font-size: 22px; color: var(--moss-800); }
  .stat-label{ font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .voice-chip{
    display: inline-block;
    background: var(--moss-50);
    color: var(--moss-800);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    margin: 4px 6px 0 0;
  }

  .weekend-tag{
    font-size: 10.5px; color: var(--plum); background: var(--plum-soft);
    padding: 2px 8px; border-radius: 999px; margin-left: 6px;
  }
  .theme-tag{
    font-size: 11px; font-weight: 700;
    color: var(--moss-800); background: var(--moss-50);
    border: 1px solid var(--moss-200);
    padding: 5px 12px; border-radius: 999px;
    flex: none;
  }
  .sample-thumb{
    width: 44px; height: 40px;
    flex: none;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Onboarding tutorial ---------- */
  .tutorial-screen{
    position: fixed;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 200;
  }
  .tutorial-topline{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 4px;
  }
  .tutorial-skip{
    border: none;
    background: none;
    color: var(--ink-faint);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 8px 4px;
  }
  .tutorial-body{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 30px;
    text-align: center;
    overflow-y: auto;
  }
  .tutorial-emoji{
    font-size: 56px;
    line-height: 1;
    margin-bottom: 22px;
  }
  .tutorial-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    color: var(--moss-800);
    margin: 0 0 18px;
    line-height: 1.5;
  }
  .tutorial-text{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink-soft);
    white-space: pre-line;
  }
  .tutorial-footer{
    padding: 10px 24px calc(24px + env(safe-area-inset-bottom));
  }
  .tutorial-dots{
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 18px;
  }
  .tutorial-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--line);
    display: inline-block;
  }
  .tutorial-dot.active{
    background: var(--moss-600);
  }
  .tutorial-nav{
    display: flex;
    gap: 10px;
  }
  .tutorial-final{
    text-align: center;
  }
  .tutorial-coachmark{
    margin-top: 14px;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--moss-50);
    border: 1.5px dashed var(--moss-400);
    color: var(--moss-800);
  }
  .tutorial-help-hint{
    margin: 0 20px 4px;
    padding: 10px 12px;
    border-radius: var(--radius-md);

      season: [],
      character: [],
      colorTheme: []
    },
    tutorialSeen: false        // becomes true once the onboarding tutorial is completed OR skipped
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    // Drop any notifications saved in the old pre-type/periodStart schema so they can't break rendering;
    // they'll be regenerated correctly (in the new format) the next time notifications are checked.
    merged.notifications = Array.isArray(merged.notifications)
      ? merged.notifications.filter(n => n && n.type && n.periodStart && n.periodEnd)
      : [];
    return merged;
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---------------- ジャンル設定 ---------------- */
function openGenreSettings(){ ui.genreSettingsOpen = true; ui.editingGenreId = null; render(); }
function closeGenreSettings(){ ui.genreSettingsOpen = false; ui.editingGenreId = null; render(); }
function startGenreEdit(key){ ui.editingGenreId = key; render(); }
function cancelGenreEdit(){ ui.editingGenreId = null; render(); }
function saveGenreEdit(key){
  const emojiInput = document.getElementById(`genre-edit-emoji-${key}`);
  const labelInput = document.getElementById(`genre-edit-label-${key}`);
  const emoji = emojiInput ? emojiInput.value.trim() : "";
  const label = labelInput ? labelInput.value.trim() : "";
  const g = state.genres.find(x=>x.key===key);
  if(g){
    if(emoji) g.emoji = emoji;
    if(label) g.label = label;
  }
  ui.editingGenreId = null;
  saveState();
  render();
}
function addGenre(){
  const emojiInput = document.getElementById("new-genre-emoji");
  const labelInput = document.getElementById("new-genre-label");
  const label = labelInput.value.trim();
  if(!label) return;
  const emoji = emojiInput.value.trim() || "🏷️";
  state.genres.push({ key: uid(), emoji, label });
  saveState();
  render();
}
function deleteGenre(key){
  state.genres = state.genres.filter(g=>g.key!==key);
  saveState();
  render();
}
function renderGenreSettingsSheet(){
  const rows = state.genres.map(g=>{
    if(ui.editingGenreId === g.key){
      return `
        <div class="item-row">
          <input id="genre-edit-emoji-${g.key}" class="item-edit-input" style="max-width:52px;flex:none;" value="${escapeAttr(g.emoji)}" maxlength="4">
          <input id="genre-edit-label-${g.key}" class="item-edit-input" value="${escapeAttr(g.label)}">

          <button class="item-del" onclick="cancelGenreEdit()">✕</button>
        </div>
      `;
    }
    return `
      <div class="item-row">
        <div style="font-size:19px;width:28px;text-align:center;flex:none;">${g.emoji}</div>
        <div class="item-text">${escapeHtml(g.label)}</div>

  return `

function pad(n){ return n.toString().padStart(2,"0"); }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
const DOW = ["日","月","火","水","木","金","土"];
function niceDate(s){
  const d = parseYmd(s);
  return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function scoreFor(dateStr){
  const list = state.dailyWants[dateStr];
  if(!list || list.length === 0) return null;
  const done = list.filter(i=>i.done).length;
  return Math.round((done/list.length)*100);
}

/* =========================================================
   カラーテーマ（課金要素）
========================================================= */
const COLOR_THEME_RAMPS = {
  default:  { c1:[228,235,223], c2:[92,126,78],   accent50:"#E4EBDF", accent200:"#BFD1B4", accent400:"#8CAB7C", accent600:"#5C7E4E", accent800:"#3E5A37", bg:"#EEF1EA", bgSoft:"#F7F8F4" },
  lavender: { c1:[233,228,240], c2:[124,101,163], accent50:"#EDE7F1", accent200:"#D2C3E0", accent400:"#A78BC9", accent600:"#7C65A3", accent800:"#54427A", bg:"#F1EEF6", bgSoft:"#F9F7FB" },
  peach:    { c1:[245,228,220], c2:[196,120,90],  accent50:"#FBEDE6", accent200:"#F0CBB8", accent400:"#E0A583", accent600:"#C4785A", accent800:"#95543C", bg:"#FBF0EA", bgSoft:"#FDF7F3" },
  sky:      { c1:[222,234,240], c2:[79,133,163],  accent50:"#E6EEF1", accent200:"#B9D3DE", accent400:"#7CAABF", accent600:"#4F85A3", accent800:"#375E73", bg:"#EDF3F6", bgSoft:"#F6FAFB" },
  yellow:   { c1:[240,226,168], c2:[143,115,38],  accent50:"#FBF6E3", accent200:"#F0E2A8", accent400:"#E0C468", accent600:"#C9A43C", accent800:"#8F7326", bg:"#FBF8EC", bgSoft:"#FDFBF3" }
};
function getAccentRamp(){
  const key = (state.customization && state.customization.colorTheme) || "default";
  return COLOR_THEME_RAMPS[key] || COLOR_THEME_RAMPS.default;
}
function applyColorTheme(){
  const ramp = getAccentRamp();
  const root = document.documentElement.style;
  root.setProperty("--moss-50", ramp.accent50);
  root.setProperty("--moss-200", ramp.accent200);
  root.setProperty("--moss-400", ramp.accent400);
  root.setProperty("--moss-600", ramp.accent600);
  root.setProperty("--moss-800", ramp.accent800);
  root.setProperty("--bg", ramp.bg);
  root.setProperty("--bg-soft", ramp.bgSoft);
}
function hexToRgb(hex){
  hex = hex.replace("#","");
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function lerpColor(hex1, hex2, t){
  const a = hexToRgb(hex1), b = hexToRgb(hex2);
  const r = Math.round(a[0]+(b[0]-a[0])*t);
  const g = Math.round(a[1]+(b[1]-a[1])*t);
  const bl = Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}

function scoreRGB(score){
  if(score === null) return null;
  const t = score/100;
  const ramp = getAccentRamp();
  const c1 = ramp.c1, c2 = ramp.c2;
  return [
    Math.round(c1[0] + (c2[0]-c1[0])*t),
    Math.round(c1[1] + (c2[1]-c1[1])*t),
    Math.round(c1[2] + (c2[2]-c1[2])*t)
  ];
}
function scoreColor(score){
  const rgb = scoreRGB(score);
  return rgb ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` : "var(--bg-soft)";
}
function scoreTextColor(score){
  const rgb = scoreRGB(score);
  if(!rgb) return "var(--ink-soft)";
  const luminance = 0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2];
  return luminance < 150 ? "var(--ink-on-dark)" : "var(--ink)";
}
function orbGradient(score){
  const rgb = scoreRGB(score);
  if(!rgb) return "var(--bg-soft)";
  const [r,g,b] = rgb;
  const lighten = (v)=> Math.min(255, v + 22);
  const light = `rgb(${lighten(r)},${lighten(g)},${lighten(b)})`;
  const base = `rgb(${r},${g},${b})`;
  return `radial-gradient(circle at 35% 30%, ${light}, ${base})`;
}

function scoreCaption(score){
  if(score === null) return "今日はまだ何も登録されていません。小さな声でも、聞こえたら書いてみましょう。";
  if(score >= 80) return "自分の声に、たくさん応えてあげられています。";
  if(score >= 50) return "自分の声に、ちゃんと耳を傾けられています。";
  if(score >= 20) return "少しだけでも、自分のために動けた日です。";
  return "今日は難しかったかもしれません。それでも、書き残せたことが一歩です。";
}

function tierFor(score){

function renderPlant(score, mood){
  const palette = CHARACTER_COLORS.plant;
  const tier = tierFor(score);
  const tVal = { dormant:0, low:0.25, mid:0.5, full:0.75, lush:1 }[tier];
  const color = lerpColor(palette.c1, palette.c2, tVal);
  const config = {
    dormant: { top:80, leaves:[{t:0.5,ang:-40,len:9},{t:0.95,ang:35,len:9}] },
    low:     { top:66, leaves:[{t:0.3,ang:-45,len:12},{t:0.6,ang:40,len:12},{t:0.95,ang:-18,len:13}] },
    mid:     { top:52, leaves:[{t:0.25,ang:-50,len:15},{t:0.45,ang:45,len:15},{t:0.65,ang:-35,len:16},{t:0.85,ang:38,len:16},{t:1,ang:-10,len:13}] },
    full:    { top:40, leaves:[{t:0.2,ang:-52,len:17},{t:0.38,ang:48,len:17},{t:0.55,ang:-38,len:18},{t:0.72,ang:40,len:18},{t:0.88,ang:-22,len:15},{t:1,ang:18,len:13},{t:1,ang:-14,len:13}] },
    lush:    { top:26, leaves:[{t:0.15,ang:-55,len:18},{t:0.3,ang:52,len:18},{t:0.45,ang:-42,len:19},{t:0.6,ang:44,len:19},{t:0.74,ang:-30,len:17},{t:0.87,ang:28,len:16},{t:0.97,ang:-14,len:14},{t:1,ang:14,len:13},{t:1,ang:0,len:12}] }
  };
  const c = config[tier];
  const baseX = 70, baseY = 92;
  let leavesSvg = "";
  c.leaves.forEach(leaf=>{
    const y = baseY - (baseY - c.top) * leaf.t;
    const rad = leaf.ang * Math.PI / 180;
    const ex = (baseX + Math.sin(rad) * leaf.len).toFixed(1);
    const ey = (y - Math.cos(rad) * leaf.len * 0.4).toFixed(1);
    const ry = (leaf.len * 0.42).toFixed(1);
    leavesSvg += `<ellipse cx="${ex}" cy="${ey}" rx="${leaf.len}" ry="${ry}" fill="${color}" transform="rotate(${leaf.ang} ${ex} ${ey})" opacity="0.92"/>`;
  });
  return `
    <svg viewBox="0 0 140 128" width="118" height="108">
      ${tierGlow(mood)}
      <ellipse cx="70" cy="94" rx="26" ry="6" fill="#00000012"/>
      <path d="M46 92 L94 92 L87 120 L53 120 Z" fill="#D9C6A0"/>
      <ellipse cx="70" cy="92" rx="24" ry="5" fill="#8a7452" opacity="0.35"/>
      <line x1="70" y1="92" x2="70" y2="${c.top}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
      ${leavesSvg}
    </svg>
  `;
}

const FISH_TIERS = {
  dormant: { rx:15, ry:10, cx:60, cy:80, tailLen:12, tailSpread:5, eyeR:1.6 },
  low:     { rx:19, ry:13, cx:62, cy:76, tailLen:16, tailSpread:8, eyeR:1.9 },
  mid:     { rx:24, ry:16, cx:64, cy:71, tailLen:19, tailSpread:12, eyeR:2.3 },
  full:    { rx:30, ry:20, cx:66, cy:66, tailLen:22, tailSpread:16, eyeR:2.8 },
  lush:    { rx:30, ry:20, cx:66, cy:66, tailLen:22, tailSpread:16, eyeR:2.8 }
};
function fishShape(p, color, eyeOpen){
  const tailX = p.cx + p.rx;
  const eyeX = (p.cx - p.rx*0.55).toFixed(1);
  const eyeY = (p.cy - p.ry*0.15).toFixed(1);
  return `
    <ellipse cx="${p.cx}" cy="${p.cy}" rx="${p.rx}" ry="${p.ry}" fill="${color}"/>
    <path d="M${tailX} ${p.cy} L${(tailX+p.tailLen).toFixed(1)} ${(p.cy-p.tailSpread).toFixed(1)} L${(tailX+p.tailLen).toFixed(1)} ${(p.cy+p.tailSpread).toFixed(1)} Z" fill="${color}" opacity="0.85"/>
    <path d="M${(p.cx-8).toFixed(1)} ${(p.cy-p.ry*0.5).toFixed(1)} Q${p.cx} ${(p.cy-p.ry*1.1).toFixed(1)} ${(p.cx+8).toFixed(1)} ${(p.cy-p.ry*0.5).toFixed(1)} Z" fill="${color}" opacity="0.7"/>
    ${eyeOpen
      ? `<circle cx="${eyeX}" cy="${eyeY}" r="${p.eyeR}" fill="#2E4A5A"/><circle cx="${(eyeX-1).toFixed(1)}" cy="${(eyeY-1).toFixed(1)}" r="${(p.eyeR*0.35).toFixed(1)}" fill="#FFFFFF"/>`
      : `<line x1="${(p.cx-p.rx*0.65).toFixed(1)}" y1="${eyeY}" x2="${(p.cx-p.rx*0.3).toFixed(1)}" y2="${eyeY}" stroke="#2E4A5A" stroke-width="1.6" stroke-linecap="round"/>`
    }
  `;
}
function fishBubbles(count, anchorX, anchorY){
  const spots = [[8,-8,2.2],[16,-18,2.8],[2,-24,1.8],[22,-30,2.4],[-6,-32,1.6],[26,-12,2],[-10,-20,1.4],[30,-24,1.8],[-2,-40,1.6],[14,-42,2]];
  let svg = "";
  for(let i=0;i<count;i++){
    const [dx,dy,r] = spots[i % spots.length];
    const wrapExtra = Math.floor(i/spots.length) * 10;
    svg += `<circle cx="${(anchorX+dx).toFixed(1)}" cy="${(anchorY+dy-wrapExtra).toFixed(1)}" r="${r}" fill="#FFFFFF" opacity="0.6"/>`;
  }
  return svg;
}
function renderFish(score, mood){
  const tier = tierFor(score);
  const bodyColor = "#8FBBD9";
  const babyColor = "#BEDCE9";
  const p = FISH_TIERS[tier];
  const eyeOpen = tier !== "dormant";
  const bubbleCount = { dormant:0, low:2, mid:4, full:6, lush:9 }[tier];
  let content = `<ellipse cx="70" cy="94" rx="26" ry="6" fill="#00000012"/>`;
  content += fishShape(p, bodyColor, eyeOpen);
  if(tier === "lush"){
    content += fishShape({ rx:12, ry:8, cx:32, cy:88, tailLen:9, tailSpread:4, eyeR:1.2 }, babyColor, true);
  }
  content += fishBubbles(bubbleCount, p.cx - p.rx*0.2, p.cy - p.ry - 4);
  return `
    <svg viewBox="0 0 140 128" width="118" height="108">
      ${tierGlow(mood)}
      ${content}
    </svg>
  `;
}

const SEASON_GRADIENTS = {
  spring: ["#FCEFF3","#F8DCE6"],
  summer: ["#EAF6FB","#DCEFF7"],
  autumn: ["#FBF0E4","#F5E1C8"],
  winter: ["#EEF4F7","#E3EEF4"]
};
function monthToSeason(m){
  if(m>=3 && m<=5) return "spring";
  if(m>=6 && m<=8) return "summer";
  if(m>=9 && m<=11) return "autumn";
  return "winter";
}
function getRealCurrentSeason(){
  return monthToSeason(new Date().getMonth() + 1);
}
function getActiveSeason(){
  const setting = (state.customization && state.customization.season) || "auto";
  if(setting === "none") return null;
  if(setting !== "auto") return setting;
  return getRealCurrentSeason();
}
function sakuraBlossom(cx, cy, scale, rotation){
  let petals = "";
  for(let i=0;i<5;i++){
    const angle = rotation + i*72;
    const rad = angle * Math.PI/180;
    const px = cx + Math.cos(rad)*2.1*scale;
    const py = cy + Math.sin(rad)*2.1*scale;
    petals += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(2.1*scale).toFixed(1)}" ry="${(1.4*scale).toFixed(1)}" fill="#F3B8CB" transform="rotate(${angle} ${px.toFixed(1)} ${py.toFixed(1)})"/>`;
  }
  petals += `<circle cx="${cx}" cy="${cy}" r="${(0.8*scale).toFixed(1)}" fill="#F6D9E3"/>`;
  return petals;
}
function fallingLeaf(cx, cy, scale, rotation, color){
  return `
    <g transform="translate(${cx} ${cy}) rotate(${rotation}) scale(${scale})">
      <path d="M0 -6 C4 -4 4 4 0 8 C-4 4 -4 -4 0 -6 Z" fill="${color}"/>
      <line x1="0" y1="-5" x2="0" y2="7" stroke="rgba(90,55,20,0.25)" stroke-width="0.6"/>
    </g>
  `;
}
function snowflake(cx, cy, scale){
  let lines = "";
  for(let i=0;i<3;i++){
    const angle = i*60;
    const rad = angle * Math.PI/180;
    const r = 3.6*scale;
    const x1 = cx - Math.cos(rad)*r, y1 = cy - Math.sin(rad)*r;
    const x2 = cx + Math.cos(rad)*r, y2 = cy + Math.sin(rad)*r;
    lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#FFFFFF" stroke-width="${(0.9*scale).toFixed(1)}" stroke-linecap="round"/>`;

}
function seasonDecorSvg(season){

      .map(([x,y,s,r])=> sakuraBlossom(x,y,s,r)).join("");

  if(season === "summer"){
    return `
      <circle cx="96" cy="16" r="10" fill="#FFE9A8" opacity="0.6"/>

  if(season === "autumn"){
    return [[18,20,0.9,20,"#E3A45C"],[100,18,0.8,-30,"#C97A4A"],[60,12,0.7,60,"#D98E4E"],[35,30,0.6,-10,"#C97A4A"],[85,30,0.65,100,"#E3A45C"]]
      .map(([x,y,s,r,c])=> fallingLeaf(x,y,s,r,c)).join("");

  return `<div class="genre-strip">${chips}<button type="button" class="genre-chip" onclick="applyItemGenre('${safeKey}', null)">なし</button></div>`;

function findItemByRowKey(rowKey){
  const parts = rowKey.split("|");
  const type = parts[0];
  if(type === "today"){
    const list = state.dailyWants[parts[1]];
    return list && list.find(i=>i.id===parts[2]);
  }else if(type === "wishlist"){
    return state.wishlist.find(i=>i.id===parts[1]);
  }else if(type === "weekend"){
    return state.weekendList.find(i=>i.id===parts[1]);

// Tapping directly on a "blank" background element (a card or section, not one of its
// children) commits and closes any currently-open inline edit, so the person isn't stuck
// relying on the keyboard's "done" button. Guarded by target===currentTarget so it only
// fires for genuine background taps, never for taps that land on a row, button, or input.
// The actual work is deferred to the next tick (setTimeout 0): mutating the DOM / blurring
// an input *while the current click event is still dispatching* is a known source of
// mobile Safari glitches (stuck focus, viewport jumps), so we let this click finish
// completely first and only then close the edit.
function commitOpenEditOnBackgroundTap(e){
  if(e.target !== e.currentTarget) return;
  if(!ui.editing) return;
  setTimeout(function(){
    if(!ui.editing) return;
    const input = document.querySelector(".item-edit-input");
    if(input){
      input.blur();
    }else{
      ui.editing = null;
      render();
    }
    window.scrollTo(0,0);
  }, 0);
}
function commitEdit(key, value){
  const text = value.trim();
  ui.editing = null;
  if(!text){ render(); return; }
  const item = findItemByRowKey(key);
  if(item) item.text = text;
  saveState();
  render();
}

/* ---------------- 「今日」向けの履歴・休憩リストからのクイック追加 ---------------- */
function recentWantEntries(){
  const dates = Object.keys(state.dailyWants).sort().reverse();
  const seen = new Set();
  const result = [];
  for(const d of dates){
    const items = state.dailyWants[d];
    for(let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      if(!seen.has(it.text)){
        seen.add(it.text);
        result.push({ text: it.text, genre: it.genre || null });
      }
      if(result.length >= 10) return result;
    }
  }
  return result;
}

  ui.historyPickerOpenForAdd = !ui.historyPickerOpenForAdd;
  render();
}

function suggestionGroup(label, items, onclickFnName){
  if(!items.length) return "";
  let html = `<div class="muted" style="margin:10px 0 4px;">${label}</div><div class="genre-strip" style="padding-left:2px;">`;
  html += items.map(it => `<button type="button" class="genre-chip" onmousedown="event.preventDefault()" onclick="${onclickFnName}('${escapeAttr(it.text)}', ${it.genre ? `'${it.genre}'` : "null"})">${it.genre ? genreEmoji(it.genre)+" " : ""}${escapeHtml(it.text)}</button>`).join("");
  html += `</div>`;
  return html;
}
function historyStripForForm(){
  if(!ui.historyPickerOpenForAdd) return "";
  const history = recentWantEntries();
  const restItems = state.restList.map(r=>({text:r.text, genre:r.genre}));
  const weekendItems = state.weekendList.map(w=>({text:w.text, genre:w.genre}));
  const wishlistItems = state.wishlist.filter(w=>!w.done).map(w=>({text:w.text, genre:w.genre}));
  let html = "";
  html += suggestionGroup("よく使う", history, "quickAddToday");

/* ---------------- 汎用：ジャンル順の並び替え・グループ表示 ---------------- */
function sortByGenreIfNeeded(items, on){
  if(!on) return items;
  const order = state.genres.map(g=>g.key);
  return items.map((item,i)=>({item,i})).sort((a,b)=>{
    const ai = a.item.genre ? order.indexOf(a.item.genre) : order.length;
    const bi = b.item.genre ? order.indexOf(b.item.genre) : order.length;
    if(ai !== bi) return ai - bi;
    return a.i - b.i;
  }).map(x=>x.item);
}
function renderItemsWithGenreGroups(items, groupOn, rowRenderFn){
  if(!groupOn) return items.map(rowRenderFn).join("");
  let html = "";
  let lastGenre = "__unset__";
  items.forEach(item=>{
    if(item.genre !== lastGenre){
      lastGenre = item.genre;
      const label = item.genre ? `${genreEmoji(item.genre)} ${genreLabel(item.genre)}` : "🏷️ ジャンルなし";
      html += `<div class="genre-group-label">${label}</div>`;
    }
    html += rowRenderFn(item);
  });
  return html;
}

function renderScoreLineChart(days, opts){
  opts = opts || {};
  const chartColor = getAccentRamp().accent600;
  const W = 300, H = 130;
  const padL = 26, padR = 12, padT = 14, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const n = days.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;
  const points = days.map((d, i) => {
    const s = scoreFor(d);
    const x = padL + stepX * i;
    const y = s === null ? null : padT + plotH - (s / 100) * plotH;
    return { x, y, s, d };
  });

  let grid = "";
  [0, 50, 100].forEach(v => {
    const y = padT + plotH - (v / 100) * plotH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#E1E3DA" stroke-width="1"/>`;
    grid += `<text x="${padL - 6}" y="${(y + 3).toFixed(1)}" font-size="8" fill="#A2A599" text-anchor="end">${v}</text>`;
  });

  const segments = [];
  let current = [];
  points.forEach(p => {
    if(p.y === null){
      if(current.length) segments.push(current);
      current = [];
    }else{
      current.push(p);
    }
  });
  if(current.length) segments.push(current);

  const pathsSvg = segments.map(seg => {
    const d = seg.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${chartColor}" stroke-width="${n>10?2.2:2.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");

  const dotR = n > 10 ? 1.6 : 3.2;
  const dotsSvg = points.filter(p => p.y !== null).map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR}" fill="${chartColor}"/>`
  ).join("");

  let labelsSvg = "";
  if(opts.labelMode === "sparse"){
    const every = Math.max(1, Math.ceil(n/6));
    points.forEach((p,i)=>{
      if(i % every === 0 || i === n-1){
        const dObj = parseYmd(p.d);
        labelsSvg += `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="8" fill="#6B6E63" text-anchor="middle">${dObj.getDate()}</text>`;
      }
    });
  }else{
    points.forEach(p=>{
      const dObj = parseYmd(p.d);
      labelsSvg += `<text x="${p.x.toFixed(1)}" y="${H-6}" font-size="9" fill="#6B6E63" text-anchor="middle">${DOW[dObj.getDay()]}</text>`;
    });
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">${grid}${pathsSvg}${dotsSvg}${labelsSvg}</svg>`;
}

function computeWeekStats(days){
  const scores = days.map(scoreFor).filter(s=>s!==null);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const respondedDays = days.filter(d=>{ const s=scoreFor(d); return s!==null && s>0; }).length;
  let registered = 0, completed = 0;
  days.forEach(d=>{
    const list = state.dailyWants[d] || [];
    registered += list.length;
    completed += list.filter(i=>i.done).length;
  });
  const seenVoices = new Map(); // text -> genre, first-occurrence order preserved
  days.forEach(d=> (state.dailyWants[d]||[]).forEach(i=>{
    if(!seenVoices.has(i.text)) seenVoices.set(i.text, i.genre || null);
  }));
  const uniqueVoices = [...seenVoices.entries()].slice(-10).reverse().map(([text,genre])=>({text,genre}));
  return { avg, respondedDays, registered, completed, uniqueVoices };
}

function computeGenreBreakdown(days){
  const totals = {};
  days.forEach(d=>{
    (state.dailyWants[d]||[]).forEach(item=>{
      const key = item.genre || "__none__";
      if(!totals[key]) totals[key] = { total:0, done:0 };
      totals[key].total++;
      if(item.done) totals[key].done++;
    });
  });
  const rows = Object.keys(totals).map(k => k === "__none__"
    ? { emoji: "🏷️", label: "ジャンルなし", total: totals[k].total, done: totals[k].done }
    : { emoji: genreEmoji(k), label: genreLabel(k), total: totals[k].total, done: totals[k].done }
  );
  rows.sort((a,b)=> b.total - a.total);
  return rows.slice(0, 5);
}

function renderPeriodReportBody(days, opts){
  opts = opts || {};
  const periodWord = opts.periodWord || "週";
  const stats = opts.stats || computeWeekStats(days);
  const chartOpts = days.length > 10 ? { labelMode:"sparse" } : { labelMode:"weekday" };
  const genreRows = computeGenreBreakdown(days);
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">${periodWord}間スコアの推移</div>
      ${renderScoreLineChart(days, chartOpts)}
    </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-num">${stats.avg===null?'—':stats.avg}</div>
          <div class="stat-label">平均スコア</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${stats.respondedDays} / ${days.length}</div>
          <div class="stat-label">自分の声に応えられた日</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${stats.registered}</div>
          <div class="stat-label">やりたいこと</div>
        </div>
        <div class="stat-box">

          <div class="stat-label">実行したこと</div>
        </div>
      </div>
    </div>
    ${genreRows.length ? `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">多かったジャンル トップ5</div>

        const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
        return `
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;">
              <span>${r.emoji} ${escapeHtml(r.label)}</span>
              <span class="muted">${r.done} / ${r.total}</span>

      <div class="card-title">この${periodWord}のあなたの心の声</div>
      ${stats.uniqueVoices.length === 0
        ? `<div class="empty-hint">まだ心の声が記録されていません。</div>`
        : stats.uniqueVoices.map(v=>`<span class="voice-chip">${v.genre ? genreEmoji(v.genre)+" " : ""}${escapeHtml(v.text)}</span>`).join("")
      }

function renderReviewSheet(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(fmt(d));
  }
  return `
    <div class="sheet-overlay" onclick="if(event.target===this)closeReview()">
      <div class="sheet">
        <div class="sheet-head">
          <h2>今週の心ログ</h2>
          <button class="iconbtn" onclick="closeReview()">✕</button>
        </div>
        ${renderPeriodReportBody(days)}
      </div>
    </div>
  `;
}

/* ---------------- お知らせ（週・月ごとに積み重なる通知） ---------------- */
function mondayOfWeek(d){
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  return monday;
}
function daysBetween(startStr, endStr){
  const start = parseYmd(startStr), end = parseYmd(endStr);
  const days = [];
  const cur = new Date(start);
  while(cur <= end){
    days.push(fmt(cur));
    cur.setDate(cur.getDate()+1);
  }
  return days;
}
function weekDaysFrom(mondayStr){
  const start = parseYmd(mondayStr);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  return daysBetween(mondayStr, fmt(end));
}
function shortDate(dateStr){
  const d = parseYmd(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function periodMessageTitle(n){
  if(n.type === "month"){
    const d = parseYmd(n.periodStart);
    return `${d.getMonth()+1}月の記録が届きました`;
  }
  return `${shortDate(n.periodStart)}〜${shortDate(n.periodEnd)}の記録が届きました`;
}
function ensureWeeklyNotifications(){
  if(!state.notifications) state.notifications = [];
  const existing = new Set(state.notifications.filter(n=>n.type==="week").map(n=>n.periodStart));
  const thisMonday = mondayOfWeek(new Date());
  const cursor = new Date(thisMonday);
  cursor.setDate(cursor.getDate() - 7); // start from the last fully-completed week
  let changed = false;
  for(let i=0; i<26; i++){
    const mondayStr = fmt(cursor);
    if(!existing.has(mondayStr)){
      const days = weekDaysFrom(mondayStr);
      if(days.some(d => scoreFor(d) !== null)){
        state.notifications.push({ id: `week:${mondayStr}`, type:"week", periodStart: mondayStr, periodEnd: days[6], read:false });
        changed = true;
      }
    }
    cursor.setDate(cursor.getDate() - 7);
  }
  if(changed) saveState();
}
function ensureMonthlyNotifications(){
  if(!state.notifications) state.notifications = [];
  const existing = new Set(state.notifications.filter(n=>n.type==="month").map(n=>n.periodStart));
  const today = new Date();
  const cursor = new Date(today.getFullYear(), today.getMonth()-1, 1); // last fully-completed month
  let changed = false;
  for(let i=0; i<12; i++){
    const monthStart = fmt(cursor);
    const monthEndDate = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
    const monthEnd = fmt(monthEndDate);
    if(!existing.has(monthStart)){
      const days = daysBetween(monthStart, monthEnd);
      if(days.some(d => scoreFor(d) !== null)){
        state.notifications.push({ id: `month:${monthStart}`, type:"month", periodStart: monthStart, periodEnd: monthEnd, read:false });
        changed = true;
      }
    }
    cursor.setMonth(cursor.getMonth()-1);
  }
  if(changed) saveState();
}
function ensureAllNotifications(){
  try{
    if(!Array.isArray(state.notifications)) state.notifications = [];
    state.notifications = state.notifications.filter(n => n && n.type && n.periodStart && n.periodEnd);
    ensureWeeklyNotifications();
    ensureMonthlyNotifications();
  }catch(err){
    console.error("notifications error, resetting:", err);
    state.notifications = [];
    saveState();
  }
}
function unreadNotificationCount(){
  return (state.notifications||[]).filter(n=>!n.read).length;
}
function openInbox(){
  ensureAllNotifications();
  ui.inboxOpen = true;
  ui.inboxDetailId = null;
  render();
}
function closeInbox(){
  ui.inboxOpen = false;
  ui.inboxDetailId = null;
  render();
}
function openNotificationDetail(id){
  const n = (state.notifications||[]).find(x=>x.id===id);
  if(n && !n.read){ n.read = true; saveState(); }
  ui.inboxDetailId = id;
  render();
}
function backToInboxList(){ ui.inboxDetailId = null; render(); }
function renderInboxSheet(){
  if(ui.inboxDetailId) return renderNotificationDetailSheet(ui.inboxDetailId);
  const list = (state.notifications||[])
    .filter(n => n && n.type && n.periodStart && n.periodEnd)
    .slice()
    .sort((a,b)=> a.periodStart < b.periodStart ? 1 : -1);
  const rows = list.length === 0
    ? `<div class="empty-hint">まだお知らせはありません。1週間分の記録がたまると、ここに届きます。</div>`
    : list.map(n=>{
        const days = daysBetween(n.periodStart, n.periodEnd);
        const stats = computeWeekStats(days);
        const title = periodMessageTitle(n);
        const icon = n.type === "month" ? "🗓️" : "📅";
        const teaser = stats.avg===null ? "記録が少ない期間でした" : `平均${stats.avg}・${stats.respondedDays}/${days.length}日応えられました`;
        return `
          <div class="item-row" style="cursor:pointer;align-items:flex-start;" onclick="openNotificationDetail('${n.id}')">
            ${!n.read ? `<span class="notif-dot"></span>` : `<span style="width:8px;flex:none;"></span>`}
            <div style="flex:1;">
              <div style="font-weight:700;font-size:13.5px;">${icon} ${title}</div>
              <div class="muted" style="margin-top:2px;">${teaser}</div>
            </div>
            <div style="color:var(--ink-faint);font-size:16px;">›</div>
          </div>
        `;
      }).join("");
  return `
    <div class="sheet-overlay" onclick="if(event.target===this)closeInbox()">
      <div class="sheet">
        <div class="sheet-head">
          <h2>お知らせ</h2>
          <button class="iconbtn" onclick="closeInbox()">✕</button>
        </div>
        <div class="card">${rows}</div>
      </div>
    </div>
  `;
}
function renderNotificationDetailSheet(id){
  const n = (state.notifications||[]).find(x=>x.id===id);
  if(!n) return renderInboxSheet();
  const days = daysBetween(n.periodStart, n.periodEnd);
  const periodWord = n.type === "month" ? "月" : "週";
  const headerTitle = n.type === "month"
    ? `${parseYmd(n.periodStart).getMonth()+1}月の記録`
    : `${shortDate(n.periodStart)}〜${shortDate(n.periodEnd)}`;
  return `
    <div class="sheet-overlay" onclick="if(event.target===this)closeInbox()">
      <div class="sheet">
        <div class="sheet-head">
          <button class="iconbtn" onclick="backToInboxList()">‹</button>
          <h2>${headerTitle}</h2>
          <button class="iconbtn" onclick="closeInbox()">✕</button>
        </div>
        <div class="card" style="margin-bottom:12px;">
          <div class="muted">${periodMessageTitle(n)}。ゆっくり眺めてみてください。</div>
        </div>
        ${renderPeriodReportBody(days, { periodWord })}
      </div>
    </div>
  `;
}

    { key:"home", ic:"🏠", label:"ホーム" },

function switchTab(tab){
  if(document.activeElement && typeof document.activeElement.blur === "function") document.activeElement.blur();
  ui.tab = tab;
  ui.editing = null;
  ui.genrePickerFor = null;
  ui.genrePickerOpenForAdd = false;
  ui.historyPickerOpenForAdd = false;
  ui.addSheetFor = null;
  ui.memoFor = null;
  ui.memoDraft = null;
  ui.inboxOpen = false;
  ui.inboxDetailId = null;
  ui.customizeOpen = false;
  newItemGenreDraft = null;
  if(tab === "diary"){ ui.diaryDate = todayStr(); ui.diaryDraft = null; }

  window.scrollTo(0,0);
}

/* ---------------- ユーティリティ ---------------- */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(str){
  return escapeHtml(str);
}

applyColorTheme();
ensureAllNotifications();
if(!state.tutorialSeen){
  ui.tutorialOpen = true;
  ui.tutorialStep = 0;
}
